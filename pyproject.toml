[project]
name = "hoc-ai"
version = "0.1.0"
description = "AI-native, graph-based learning system prototype"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "networkx>=3.3",
  "anthropic>=0.40",
  "streamlit>=1.40",
  "plotly>=5.24",
  "fastapi>=0.162.5",
  "uvicorn>=0.30",
  "openai>=3.50.0",
  "pypdf>=7.0.1",
  "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-networkx",
    "httpx>=0.28.1",
]

[project.scripts]
hoc = "hoc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app", "."]
addopts = "-q"
markers = ["live: calls the real LLM API (skipped unless HOC_LIVE=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
